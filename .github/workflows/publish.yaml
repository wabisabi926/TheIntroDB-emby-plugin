name: "Publish Plugin"

# Manual release entry point. In the Actions tab, run this workflow with a
# version such as 1.3.1.0 (or v1.3.1.0). It builds the DLL, stamps that version,
# and creates a GitHub release with the DLL and checksums attached.
# This workflow is intentionally the only publisher: running it creates the
# release itself, so there is no separate "release published" trigger that
# could upload the same assets twice.

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version (e.g. 1.3.1.0 or v1.3.1.0)"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a pre-release"
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          RAW="${{ inputs.version }}"
          TAG="$RAW"
          if [[ "$TAG" != v* ]]; then
            TAG="v$TAG"
          fi
          VERSION="${RAW#v}"
          # Accept 1.2.3 and normalise it to the four-part 1.2.3.0.
          PARTS=$(echo "$VERSION" | tr '.' '\n' | wc -l)
          if [ "$PARTS" -eq 3 ]; then
            VERSION="${VERSION}.0"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $RAW" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using version $VERSION (tag $TAG)"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build plugin
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          dotnet build TheIntroDB/TheIntroDB.csproj --configuration Release \
            -p:Version="$VERSION" \
            -p:AssemblyVersion="$VERSION" \
            -p:FileVersion="$VERSION"
          DLL="theintrodb_$VERSION.dll"
          cp TheIntroDB/bin/Release/netstandard2.0/TheIntroDB.dll "$DLL"
          sha256sum "$DLL" > "theintrodb_$VERSION.sha256"
          md5sum "$DLL" > "theintrodb_$VERSION.md5"
          ls -l

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            theintrodb_*.dll
            theintrodb_*.sha256
            theintrodb_*.md5
          fail_on_unmatched_files: true
